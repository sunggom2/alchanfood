<style>
  /* 없는 주소에서 열리므로 외부 CSS, 글꼴, 이미지를 불러오지 않는다. 토큰은 assets/css/site.css 에서 필요한 것만 복사. */
  :root {
    color-scheme: light dark;
    --bg: #F2F5F7; --ink: #0E1A20; --muted: #55656D; --line: #D8E0E5;
    --accent: #1D6898; --btn: #0E1A20; --btn-hover: #22333C; --btn-ink: #F4F7F9; --focus: #1D6898;
    --font: -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --fs-title: clamp(2rem, 1.5rem + 1.6vw, 2.75rem);
    --gutter: clamp(16px, 3.3vw, 40px);
    --sp-top: clamp(40px, 5vw, 72px);
    --r-pill: 999px; --r-xs: 4px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0D1519; --ink: #E4ECEF; --muted: #97A8B0; --line: #253238; --accent: #72B6E0; --btn: #E4ECEF; --btn-hover: #F3F7F9; --btn-ink: #0D1519; --focus: #72B6E0; }
  }
  *, *::before, *::after { box-sizing: border-box; }
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 1rem; line-height: 1.75; letter-spacing: -.01em; word-break: keep-all; }
  .wrap { width: 100%; max-width: calc(1240px + 2 * var(--gutter)); margin-inline: auto; padding-inline: var(--gutter); }
  header { height: 64px; border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; height: 100%; }
  .brand { display: inline-flex; align-items: center; min-height: 44px; font-size: 1.0625rem; font-weight: 750; letter-spacing: -.02em; line-height: 1; color: var(--ink); text-decoration: none; }
  main { padding-top: var(--sp-top); padding-bottom: 104px; }
  h1 { margin: 0; font-size: var(--fs-title); line-height: 1.22; letter-spacing: -.022em; font-weight: 700; text-wrap: balance; }
  p { margin: 20px 0 0; color: var(--muted); }
  .actions { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 32px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 22px; border: 1px solid transparent; border-radius: var(--r-pill); background: var(--btn); color: var(--btn-ink); font-weight: 600; line-height: 1; white-space: nowrap; text-decoration: none; }
  .link { display: inline-flex; align-items: center; gap: 6px; padding-block: 10px; color: var(--accent); font-weight: 600; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
  .icon { width: 18px; height: 18px; fill: currentColor; }
  .nowrap { white-space: nowrap; }
  .link .icon { width: 16px; height: 16px; }
  :where(a):focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  .link:focus-visible { border-radius: var(--r-xs); }
  @media (hover: hover) { .btn:hover { background: var(--btn-hover); } .link:hover { text-decoration-thickness: 2px; } }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var REPO = 'alchanfood';
    var base = location.hostname.endsWith('github.io') ? '/' + REPO + '/' : '/';
    document.querySelectorAll('a[data-path]').forEach(function (a) { a.href = base + a.getAttribute('data-path'); });
  });
</script>
</head>

<header><div class="wrap"><a class="brand" href="/alchanfood/" data-path="">알찬식품</a></div></header>
<main class="wrap">

  <p>주소가 바뀌었거나 없는 페이지입니다.</p>
  <div class="actions">
    <a class="link" href="/alchanfood/" data-path="">처음으로<svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></a>
    <a class="btn" href="/alchanfood/contact.html" data-path="contact.html">납품 문의<svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></a>
  </div>
</main>
